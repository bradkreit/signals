<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Signal">
<meta name="theme-color" content="#0F0E0C">
<title>Daily Signal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F0E0C;--sur:#1A1916;--sur2:#242220;--bor:#2E2C28;
  --txt:#F2EFE8;--txt2:#9C9890;--txt3:#5C5A55;
  --gold:#C8A96A;--blue:#4A7FC0;--green:#4A9A6A;--red:#C84B2F;
  --mono:'DM Mono',monospace;--serif:'Libre Baskerville',serif;--sans:'DM Sans',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);overflow:hidden;user-select:none;}

/* ── Layout ── */
.app{
  display:flex;flex-direction:column;height:100%;
  padding-top:calc(var(--safe-top)+12px);
  padding-bottom:calc(var(--safe-bottom)+12px);
}

/* ── Header ── */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px 10px;flex-shrink:0;
}
.hdr-left{display:flex;align-items:center;gap:8px;}
.hdr-icon{width:28px;height:28px;background:var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.hdr-mode{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);}
.hdr-count{font-family:var(--mono);font-size:9px;color:var(--txt3);}

/* Return home button */
.home-btn{
  font-family:var(--mono);font-size:9px;padding:4px 10px;border:1px solid var(--bor);
  border-radius:10px;background:none;color:var(--txt3);cursor:pointer;
  transition:all .12s;white-space:nowrap;
}
.home-btn:active{background:var(--sur2);color:var(--txt);}

/* ── Progress dots ── */
.dots{display:flex;justify-content:center;gap:5px;padding:0 16px 10px;flex-shrink:0;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--bor);transition:background .2s;}
.dot.active{background:var(--gold);}
.dot.visited{background:var(--bor2);}

/* ── Card area ── */
.card-wrap{
  flex:1;padding:0 16px;position:relative;overflow:hidden;
  display:flex;align-items:stretch;
}
.card{
  width:100%;background:var(--sur);border-radius:14px;
  display:flex;flex-direction:column;overflow:hidden;
  position:absolute;left:16px;right:16px;top:0;bottom:0;
  transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s;
  will-change:transform;
}
.card.slide-out-left{transform:translateX(-110%);opacity:0;}
.card.slide-out-right{transform:translateX(110%);opacity:0;}
.card.slide-in-left{transform:translateX(0);opacity:1;}
.card.incoming-right{transform:translateX(110%);opacity:0;}
.card.incoming-left{transform:translateX(-110%);opacity:0;}

/* Card image */
.card-img{
  width:100%;height:200px;object-fit:cover;flex-shrink:0;
  background:var(--sur2);
}
.card-img-placeholder{
  width:100%;height:200px;flex-shrink:0;background:var(--sur2);
  display:flex;align-items:center;justify-content:center;
}
.card-img-domain{
  font-family:var(--mono);font-size:24px;font-weight:500;
  color:var(--bor2);letter-spacing:.05em;text-transform:uppercase;
}

/* Card body */
.card-body{flex:1;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.card-date{font-family:var(--mono);font-size:9px;color:var(--txt3);margin-bottom:10px;letter-spacing:.04em;}
.card-text{font-size:15px;line-height:1.65;color:var(--txt);}
.card-footer{
  padding:10px 16px;border-top:1px solid var(--bor);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
}
.card-source{
  font-family:var(--mono);font-size:10px;color:var(--txt3);
  text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:60%;
}
.card-source:hover{color:var(--gold);}

/* ── Sort toggle (archive mode) ── */
.sort-toggle{
  font-family:var(--mono);font-size:9px;padding:3px 8px;border:1px solid var(--bor);
  border-radius:8px;background:none;color:var(--txt3);cursor:pointer;
}
.sort-toggle:active{background:var(--sur2);}

/* ── Nav buttons ── */
.nav{
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;
  gap:6px;padding:10px 16px 0;flex-shrink:0;
}
.nav-btn{
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  padding:10px 8px;border-radius:10px;border:1px solid var(--bor);
  background:var(--sur);color:var(--txt2);cursor:pointer;text-align:center;
  transition:all .12s;line-height:1.2;
}
.nav-btn:active{background:var(--sur2);border-color:var(--bor2);}
.nav-btn.primary{background:var(--gold);color:#0F0E0C;border-color:var(--gold);}
.nav-btn.primary:active{opacity:.85;}
.nav-btn.dim{color:var(--txt3);}
.nav-btn.disabled{opacity:.3;pointer-events:none;}
.nav-btn-full{grid-column:1/-1;}

/* ── End-of-deck overlay ── */
.end-overlay{
  position:absolute;inset:0;background:rgba(15,14,12,.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s;
}
.end-overlay.show{opacity:1;pointer-events:all;}
.end-title{font-family:var(--serif);font-size:16px;color:var(--txt);margin-bottom:4px;}
.end-sub{font-family:var(--mono);font-size:10px;color:var(--txt3);}
.end-btn{
  font-family:var(--mono);font-size:11px;padding:10px 24px;
  border-radius:10px;border:1px solid var(--bor);background:var(--sur);
  color:var(--txt);cursor:pointer;min-width:180px;text-align:center;
}
.end-btn.gold{background:var(--gold);color:#0F0E0C;border-color:var(--gold);}

/* ── Loading ── */
.loading{
  position:fixed;inset:0;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:100;
}
.loading-text{font-family:var(--mono);font-size:11px;color:var(--txt3);}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:24px;height:24px;border:2px solid var(--bor);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}

/* ── Archive jump indicator ── */
.jump-bar{
  background:var(--sur2);border-bottom:1px solid var(--bor);padding:6px 16px;
  font-family:var(--mono);font-size:9px;color:var(--txt3);text-align:center;
  flex-shrink:0;display:none;
}
.jump-bar.show{display:block;}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Loading signals…</div>
</div>

<div class="app" id="app" style="display:none;">
  <!-- Header -->
  <div class="hdr">
    <div class="hdr-left">
      <div class="hdr-icon">⚡</div>
      <div>
        <div class="hdr-mode" id="mode-label">Today's signals</div>
        <div class="hdr-count" id="card-count"></div>
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;">
      <button class="sort-toggle" id="sort-toggle" style="display:none;" onclick="toggleSort()">↕ Oldest first</button>
      <button class="home-btn" id="home-btn" style="display:none;" onclick="goHome()">⌂ Today</button>
    </div>
  </div>

  <!-- Progress dots (curated mode only) -->
  <div class="dots" id="dots"></div>

  <!-- Jump bar (archive mode) -->
  <div class="jump-bar" id="jump-bar"></div>

  <!-- Card -->
  <div class="card-wrap" id="card-wrap">
    <div class="card" id="card">
      <div id="card-img-area"></div>
      <div class="card-body">
        <div class="card-date" id="card-date"></div>
        <div class="card-text" id="card-text"></div>
      </div>
      <div class="card-footer">
        <a class="card-source" id="card-source" href="#" target="_blank" rel="noopener">↗ source</a>
        <div id="card-footer-right"></div>
      </div>
    </div>
    <!-- End of deck overlay -->
    <div class="end-overlay" id="end-overlay">
      <div class="end-title" id="end-title">End of deck</div>
      <div class="end-sub" id="end-sub"></div>
      <button class="end-btn gold" id="end-btn1" onclick="endAction1()"></button>
      <button class="end-btn" id="end-btn2" onclick="endAction2()"></button>
    </div>
  </div>

  <!-- Nav buttons -->
  <div class="nav" id="nav">
    <button class="nav-btn dim" id="btn-back" onclick="goBack()">← Back</button>
    <button class="nav-btn primary" id="btn-fwd" onclick="goForward()">Forward →</button>
    <button class="nav-btn" id="btn-deeper" onclick="goDeeper()">Go deeper ↓</button>
    <button class="nav-btn" id="btn-archive" onclick="goArchive()">See archive ↓</button>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────
const SHEET_ID = '1hMRxFT9kAaGQ7rGU9G8R5cpfrMM8I8nyrxLiJ1KFoBg';
const CURATED_COUNT = 5;

// ── State ─────────────────────────────────────────────────────
let ALL_ROWS = [];        // full archive, newest first
let DECK = [];            // current cards being shown
let IDX = 0;              // current position in deck
let MODE = 'curated';     // 'curated' | 'archive' | 'deeper'
let ARCHIVE_REVERSED = false;
let DEEPER_THEME = '';
let PREV_STATE = null;    // saved state for returning from deeper
let TOUCH_START_X = 0;
let TOUCH_START_Y = 0;

// ── CSV fetch & parse ─────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  let i = 0;
  while (i < text.length) {
    const row = [];
    while (i < text.length && text[i] !== '\n') {
      if (text[i] === '"') {
        let cell = ''; i++;
        while (i < text.length) {
          if (text[i] === '"' && text[i+1] === '"') { cell += '"'; i += 2; }
          else if (text[i] === '"') { i++; break; }
          else { cell += text[i++]; }
        }
        row.push(cell);
        if (text[i] === ',') i++;
      } else {
        let cell = '';
        while (i < text.length && text[i] !== ',' && text[i] !== '\n') cell += text[i++];
        row.push(cell);
        if (text[i] === ',') i++;
      }
    }
    if (text[i] === '\n') i++;
    if (row.some(c => c.trim())) rows.push(row);
  }
  return rows;
}

async function loadData() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Archive`;
  const res = await fetch(url);
  const text = await res.text();
  const rows = parseCSV(text).slice(1); // skip header if any

  ALL_ROWS = rows.map(r => {
    const rawUrl  = (r[0]||'').trim();
    const rawDate = (r[1]||'').trim();
    const content = (r[2]||'').trim();
    const tags    = (r[5]||r[3]||'').trim();
    const theme   = (r[6]||'').trim();
    const summary = (r[4]||'').trim();
    const ogImage = (r[9]||'').trim(); // col J

    // Parse date
    let date = null;
    if (rawDate) {
      date = new Date(rawDate);
      if (isNaN(date)) {
        const m = rawDate.match(/(\d{1,2})\s+(\w{3})\s+(\d{4})/);
        if (m) date = new Date(m[1]+' '+m[2]+' '+m[3]);
      }
    }

    // Extract article URL from content
    const urlMatch = content.match(/https?:\/\/\S+/);
    const articleUrl = urlMatch ? urlMatch[0] : rawUrl;
    const text = content.replace(/https?:\/\/\S+/g,'').trim() || summary;

    // Extract domain for placeholder
    let domain = '';
    try { domain = new URL(articleUrl||rawUrl).hostname.replace('www.',''); } catch(e){}

    return { rawUrl, articleUrl: articleUrl||rawUrl, date, text, tags, theme, summary, ogImage, domain };
  }).filter(r => r.text && r.date && !isNaN(r.date))
    .sort((a,b) => b.date - a.date); // newest first

  return ALL_ROWS.length > 0;
}

// ── Seeded random (stable per day) ───────────────────────────
function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    return (s >>> 0) / 0xffffffff;
  };
}

function getDailySeed() {
  const d = new Date();
  // Refresh at 3am
  const hour = d.getHours();
  const day = hour < 3 ? d.getDate() - 1 : d.getDate();
  return d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + day;
}

function getCuratedDeck() {
  const seed = getDailySeed();
  const rng = seededRandom(seed);
  const pool = [...ALL_ROWS];
  const picked = [];
  while (picked.length < CURATED_COUNT && pool.length > 0) {
    const i = Math.floor(rng() * pool.length);
    picked.push(pool.splice(i, 1)[0]);
  }
  return picked;
}

// ── Render card ───────────────────────────────────────────────
function renderCard(row, animated, direction) {
  const card = document.getElementById('card');

  if (animated) {
    card.classList.add(direction === 'fwd' ? 'slide-out-left' : 'slide-out-right');
    setTimeout(() => {
      card.classList.remove('slide-out-left','slide-out-right');
      card.classList.add(direction === 'fwd' ? 'incoming-right' : 'incoming-left');
      fillCard(row);
      requestAnimationFrame(() => {
        card.classList.remove('incoming-right','incoming-left');
        card.classList.add('slide-in-left');
        setTimeout(() => card.classList.remove('slide-in-left'), 300);
      });
    }, 250);
  } else {
    fillCard(row);
  }
}

function fillCard(row) {
  // Image area
  const imgArea = document.getElementById('card-img-area');
  if (row.ogImage) {
    imgArea.innerHTML = `<img class="card-img" src="${row.ogImage}" alt="" onerror="this.parentElement.innerHTML=makePlaceholder('${row.domain}')">`;
  } else {
    imgArea.innerHTML = makePlaceholder(row.domain);
  }

  // Date
  const ds = row.date ? row.date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}) : '';
  document.getElementById('card-date').textContent = ds;

  // Text
  document.getElementById('card-text').textContent = row.text.length > 600
    ? row.text.slice(0,600)+'…'
    : row.text;

  // Source
  const srcEl = document.getElementById('card-source');
  if (row.articleUrl) {
    srcEl.href = row.articleUrl;
    srcEl.textContent = '↗ ' + (row.domain || 'source');
    srcEl.style.display = '';
  } else {
    srcEl.style.display = 'none';
  }

  // Footer right — theme badge if available
  const fr = document.getElementById('card-footer-right');
  fr.innerHTML = row.theme
    ? `<span style="font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:8px;background:var(--sur2);color:var(--txt3);border:1px solid var(--bor);">${row.theme.split(' ').slice(0,2).join(' ')}</span>`
    : '';
}

function makePlaceholder(domain) {
  const label = (domain||'signal').split('.')[0].toUpperCase().slice(0,8);
  return `<div class="card-img-placeholder"><span class="card-img-domain">${label}</span></div>`;
}

// ── HUD updates ───────────────────────────────────────────────
function updateHUD() {
  const modeEl = document.getElementById('mode-label');
  const countEl = document.getElementById('card-count');
  const dotsEl = document.getElementById('dots');
  const homeBtn = document.getElementById('home-btn');
  const sortToggle = document.getElementById('sort-toggle');
  const jumpBar = document.getElementById('jump-bar');
  const endOverlay = document.getElementById('end-overlay');

  endOverlay.classList.remove('show');

  if (MODE === 'curated') {
    modeEl.textContent = "Today's signals";
    countEl.textContent = `${IDX+1} of ${DECK.length}`;
    homeBtn.style.display = 'none';
    sortToggle.style.display = 'none';
    jumpBar.classList.remove('show');
    renderDots();
  } else if (MODE === 'archive') {
    modeEl.textContent = ARCHIVE_REVERSED ? 'Archive — oldest first' : 'Archive — newest first';
    countEl.textContent = `${IDX+1} of ${DECK.length}`;
    homeBtn.style.display = '';
    sortToggle.style.display = '';
    sortToggle.textContent = ARCHIVE_REVERSED ? '↕ Newest first' : '↕ Oldest first';
    jumpBar.classList.remove('show');
    dotsEl.innerHTML = '';
  } else if (MODE === 'deeper') {
    modeEl.textContent = `Deeper: ${DEEPER_THEME}`;
    countEl.textContent = `${IDX+1} of ${DECK.length}`;
    homeBtn.style.display = '';
    sortToggle.style.display = 'none';
    jumpBar.classList.remove('show');
    dotsEl.innerHTML = '';
  }

  // Nav buttons
  document.getElementById('btn-back').classList.toggle('disabled', IDX === 0);
  document.getElementById('btn-archive').textContent = MODE === 'archive' ? '↑ Exit archive' : 'See archive ↓';
  document.getElementById('btn-archive').onclick = MODE === 'archive' ? goHome : goArchive;
}

function renderDots() {
  const el = document.getElementById('dots');
  el.innerHTML = DECK.map((_,i) => {
    const cls = i === IDX ? 'active' : i < IDX ? 'visited' : '';
    return `<div class="dot ${cls}"></div>`;
  }).join('');
}

// ── Navigation ────────────────────────────────────────────────
function goForward() {
  if (IDX >= DECK.length - 1) {
    showEndOverlay();
    return;
  }
  IDX++;
  renderCard(DECK[IDX], true, 'fwd');
  updateHUD();
}

function goBack() {
  if (IDX <= 0) return;
  IDX--;
  renderCard(DECK[IDX], true, 'back');
  updateHUD();
}

function goHome() {
  MODE = 'curated';
  DECK = getCuratedDeck();
  IDX = 0;
  PREV_STATE = null;
  renderCard(DECK[0], false);
  updateHUD();
}

function goArchive(jumpToDate) {
  // Save state so we can return
  PREV_STATE = { mode: MODE, deck: DECK, idx: IDX };
  MODE = 'archive';
  ARCHIVE_REVERSED = false;
  DECK = [...ALL_ROWS]; // newest first

  // If jumping to a date, find closest index
  if (jumpToDate) {
    const target = jumpToDate.getTime();
    let best = 0, bestDiff = Infinity;
    DECK.forEach((r, i) => {
      const diff = Math.abs(r.date.getTime() - target);
      if (diff < bestDiff) { bestDiff = diff; best = i; }
    });
    IDX = best;
    // Show jump indicator
    const jb = document.getElementById('jump-bar');
    jb.textContent = `Jumped to ${jumpToDate.toLocaleDateString('en-US',{month:'short',year:'numeric'})}`;
    jb.classList.add('show');
    setTimeout(() => jb.classList.remove('show'), 2000);
  } else {
    IDX = 0;
  }

  renderCard(DECK[IDX], true, 'fwd');
  updateHUD();
}

function toggleSort() {
  ARCHIVE_REVERSED = !ARCHIVE_REVERSED;
  DECK = ARCHIVE_REVERSED ? [...ALL_ROWS].reverse() : [...ALL_ROWS];
  IDX = 0;
  renderCard(DECK[0], false);
  updateHUD();
}

function goDeeper() {
  const current = DECK[IDX];
  if (!current) return;
  const theme = current.theme ? current.theme.split(' ').slice(0,3).join(' ') : '';
  if (!theme) {
    // No theme — show a brief message
    const oldText = document.getElementById('btn-deeper').textContent;
    document.getElementById('btn-deeper').textContent = 'No theme found';
    setTimeout(() => document.getElementById('btn-deeper').textContent = oldText, 1500);
    return;
  }

  // Save current position
  PREV_STATE = { mode: MODE, deck: DECK, idx: IDX, archiveDate: current.date };

  DEEPER_THEME = theme;
  MODE = 'deeper';
  // Find signals with same primary theme (first word match for robustness)
  const themeKey = theme.toLowerCase().split(' ')[0];
  DECK = ALL_ROWS.filter(r => r.theme && r.theme.toLowerCase().includes(themeKey) && r !== current);
  if (!DECK.length) {
    DECK = [current]; // fallback — just show current
  }
  IDX = 0;
  renderCard(DECK[0], true, 'fwd');
  updateHUD();
}

// ── End of deck ───────────────────────────────────────────────
function showEndOverlay() {
  const overlay = document.getElementById('end-overlay');
  const title = document.getElementById('end-title');
  const sub = document.getElementById('end-sub');
  const btn1 = document.getElementById('end-btn1');
  const btn2 = document.getElementById('end-btn2');

  if (MODE === 'deeper') {
    title.textContent = `End of "${DEEPER_THEME}" signals`;
    sub.textContent = `${DECK.length} signals in this theme`;
    btn1.textContent = '⌂ Back to today\'s signals';
    btn2.textContent = '↺ Start over in this theme';
  } else if (MODE === 'curated') {
    title.textContent = "That's today's 5";
    sub.textContent = 'New signals tomorrow at 3am';
    btn1.textContent = '↺ See them again';
    btn2.textContent = '↓ See archive';
  } else {
    title.textContent = 'End of archive';
    sub.textContent = '';
    btn1.textContent = '⌂ Back to today\'s signals';
    btn2.textContent = '↺ Start over';
  }
  overlay.classList.add('show');
}

function endAction1() {
  document.getElementById('end-overlay').classList.remove('show');
  if (MODE === 'deeper') {
    goHome();
  } else if (MODE === 'curated') {
    IDX = 0;
    renderCard(DECK[0], false);
    updateHUD();
  } else {
    goHome();
  }
}

function endAction2() {
  document.getElementById('end-overlay').classList.remove('show');
  if (MODE === 'deeper') {
    IDX = 0;
    renderCard(DECK[0], false);
    updateHUD();
  } else if (MODE === 'curated') {
    goArchive();
  } else {
    IDX = 0;
    renderCard(DECK[0], false);
    updateHUD();
  }
}

// Archive-specific deeper: show extra jump option
function goDeeperFromArchive() {
  const current = DECK[IDX];
  const savedDate = current ? current.date : null;

  goDeeper();

  // Add "Jump to this date in archive" option to the nav
  // (We'll show this as a prompt using the home button area)
  if (savedDate && MODE === 'deeper') {
    const homeBtn = document.getElementById('home-btn');
    const origText = homeBtn.textContent;
    const origClick = homeBtn.onclick;

    // Add secondary button temporarily
    const jumpBtn = document.createElement('button');
    jumpBtn.className = 'home-btn';
    jumpBtn.textContent = '📅 That date';
    jumpBtn.title = `Jump to ${savedDate.toLocaleDateString('en-US',{month:'short',year:'numeric'})} in archive`;
    jumpBtn.onclick = () => {
      jumpBtn.remove();
      homeBtn.textContent = origText;
      homeBtn.onclick = origClick;
      goArchive(savedDate);
    };
    homeBtn.parentElement.insertBefore(jumpBtn, homeBtn);

    // Auto-remove after 8 seconds
    setTimeout(() => {
      if (jumpBtn.parentElement) {
        jumpBtn.remove();
      }
    }, 8000);
  }
}

// Override btn-deeper click when in archive mode
function handleDeeperClick() {
  if (MODE === 'archive') {
    goDeeperFromArchive();
  } else {
    goDeeper();
  }
}

// ── Touch / swipe ────────────────────────────────────────────
document.addEventListener('touchstart', e => {
  TOUCH_START_X = e.touches[0].clientX;
  TOUCH_START_Y = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - TOUCH_START_X;
  const dy = e.changedTouches[0].clientY - TOUCH_START_Y;
  if (Math.abs(dx) < 40 || Math.abs(dy) > Math.abs(dx)) return; // not a horizontal swipe
  if (dx < 0) goForward();
  else goBack();
});

// Keyboard support for desktop testing
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goForward();
  if (e.key === 'ArrowLeft') goBack();
  if (e.key === 'ArrowDown') handleDeeperClick();
});

// ── Init ──────────────────────────────────────────────────────
document.getElementById('btn-deeper').onclick = handleDeeperClick;

async function init() {
  try {
    const ok = await loadData();
    if (!ok) throw new Error('No signals loaded');

    DECK = getCuratedDeck();
    IDX = 0;
    MODE = 'curated';

    fillCard(DECK[0]);
    updateHUD();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  } catch(e) {
    document.getElementById('loading').innerHTML = `
      <div style="font-family:monospace;font-size:12px;color:#C84B2F;text-align:center;padding:20px;">
        Could not load signals.<br><br>
        <span style="color:#5C5A55;font-size:10px;">Make sure your Google Sheet is publicly accessible.</span>
      </div>`;
  }
}

init();
</script>
