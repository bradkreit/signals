<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Signal">
<meta name="theme-color" content="#0d0c11">
<title>Daily Signal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0c11;
  --txt:#f6f4ef;
  --txt2:#9d97ab;
  --txt3:#6f6a7d;
  --txt4:#4e4a5b;
  --line:#221f2a;
  --line2:#322d3f;
  --seg:#1c1a24;
  --seg-past:#3a3547;
  --accent-default:oklch(0.74 0.09 300);
  --mono:'DM Mono',ui-monospace,monospace;
  --serif:'Newsreader',Georgia,serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--serif);overflow:hidden;}
a{color:var(--txt);}

.app{display:flex;flex-direction:column;height:100%;
  padding:calc(var(--safe-top) + 18px) 22px calc(var(--safe-bottom) + 18px);}

/* Header */
.hdr{display:flex;align-items:baseline;justify-content:space-between;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);flex-shrink:0;}
.hdr-count{letter-spacing:.1em;}

/* Progress segments */
.segs{display:flex;gap:4px;height:2px;margin-top:12px;flex-shrink:0;}
.seg{flex:1;border-radius:2px;background:var(--seg);transition:background .2s;}
.seg.past{background:var(--seg-past);}
.seg.now{background:var(--accent,var(--accent-default));}

/* Card */
.card{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;
  padding:34px 0;min-height:0;
  transition:opacity .16s ease,transform .16s ease;}
.card.fade{opacity:0;transform:translateY(6px);}

.theme{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:#8a8499;flex-shrink:0;}
.theme-dot{width:6px;height:6px;border-radius:50%;background:var(--accent,var(--accent-default));flex-shrink:0;}

.signal{font-weight:300;letter-spacing:-.01em;color:var(--txt);text-wrap:pretty;
  overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;}

.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
  font-family:var(--mono);font-size:11px;flex-shrink:0;}
.meta a{color:var(--txt);text-decoration:none;border-bottom:1px solid #37333f;padding-bottom:3px;letter-spacing:.02em;}
.meta a:active{color:#fff;}
.meta .date{color:var(--txt4);}
.jump{background:none;border:0;padding:3px 0;color:var(--txt3);font-family:var(--mono);font-size:11px;cursor:pointer;}

.loading-line{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#5c5769;}

/* Nav */
.nav{display:flex;gap:10px;flex-shrink:0;}
.nav button{min-height:52px;border-radius:2px;font-family:var(--mono);font-size:12px;cursor:pointer;
  background:transparent;transition:background .12s,color .12s;}
.btn-back{flex:1;border:1px solid var(--line);color:#8a8499;letter-spacing:.08em;}
.btn-back:active{background:#161420;}
.btn-back.off{color:#332f3c;pointer-events:none;}
.btn-next{flex:4;border:1px solid var(--line2);background:#15131d;color:var(--txt);
  letter-spacing:.12em;text-transform:uppercase;}
.btn-next:active{background:#1d1a27;}

.foot{display:flex;justify-content:space-between;margin-top:14px;flex-shrink:0;}
.foot button{background:none;border:0;padding:6px 0;color:#5c5769;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;}
.foot button:active{color:var(--txt2);}

.disabled{opacity:.35;pointer-events:none;}
.note{margin-top:10px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:#463f52;min-height:12px;}
</style>
</head>
<body>

<div class="app">
  <div class="hdr">
    <span id="mode-label">Daily signal</span>
    <span class="hdr-count" id="count"></span>
  </div>

  <div class="segs" id="segs"></div>

  <div class="card" id="card">
    <div class="theme" id="theme" style="display:none;">
      <span class="theme-dot"></span><span id="theme-text"></span>
    </div>
    <div class="signal" id="signal"></div>
    <div class="loading-line" id="loading-line">Loading signals…</div>
    <div class="meta" id="meta" style="display:none;">
      <a id="source" href="#" target="_blank" rel="noopener"></a>
      <button class="jump" id="jump" style="display:none;"></button>
      <span class="date" id="date"></span>
    </div>
  </div>

  <div class="nav disabled" id="nav">
    <button class="btn-back off" id="btn-back" onclick="go(-1)">←</button>
    <button class="btn-next" id="btn-next" onclick="go(1)">Next</button>
  </div>

  <div class="foot disabled" id="foot">
    <button id="btn-deeper" onclick="toDeeper()">more like this</button>
    <button id="btn-archive" onclick="toArchive()">archive</button>
  </div>

  <div class="note" id="note"></div>
</div>

<script>
const SHEET_ID='1hMRxFT9kAaGQ7rGU9G8R5cpfrMM8I8nyrxLiJ1KFoBg';
const CURATED_COUNT=5;

const ACCENTS={
  social:'oklch(0.74 0.11 350)',society:'oklch(0.74 0.11 350)',
  technolog:'oklch(0.74 0.11 265)',
  econom:'oklch(0.74 0.11 195)',
  environm:'oklch(0.74 0.11 145)',
  politic:'oklch(0.74 0.11 55)',
  legal:'oklch(0.74 0.11 95)'
};
const DEFAULT_ACCENT='oklch(0.74 0.09 300)';

let ALL_ROWS=[],DECK=[],IDX=0,MODE='today',DEEPER_THEME='',ARCHIVE_REVERSED=false;
let TX=0,TY=0,BUSY=false,JUMP_DATE=null;

/* Accent keyed off the FIRST listed theme only */
function accentFor(theme){
  const first=(theme||'').split(/[,\/|]/)[0].trim().toLowerCase();
  if(!first)return DEFAULT_ACCENT;
  for(const k in ACCENTS)if(first.indexOf(k)>-1)return ACCENTS[k];
  return DEFAULT_ACCENT;
}
function themeLabel(theme){
  return (theme||'').split(/[,\/|]/).map(t=>t.trim()).filter(Boolean).slice(0,2).join(' · ');
}

function parseCSV(text){
  const rows=[];let i=0;
  while(i<text.length){
    const row=[];
    while(i<text.length&&text[i]!=='\n'){
      if(text[i]==='"'){
        let cell='';i++;
        while(i<text.length){
          if(text[i]==='"'&&text[i+1]==='"'){cell+='"';i+=2;}
          else if(text[i]==='"'){i++;break;}
          else cell+=text[i++];
        }
        row.push(cell);if(text[i]===',')i++;
      }else{
        let cell='';
        while(i<text.length&&text[i]!==','&&text[i]!=='\n')cell+=text[i++];
        row.push(cell);if(text[i]===',')i++;
      }
    }
    if(text[i]==='\n')i++;
    if(row.some(c=>c.trim()))rows.push(row);
  }
  return rows;
}

async function loadData(){
  const sheetNames=['Archive','archive','Sheet1'];
  let rows=[];
  for(const sheetName of sheetNames){
    try{
      const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(sheetName);
      const res=await Promise.race([fetch(url),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timeout')),12000))]);
      if(!res.ok)continue;
      const text=await res.text();
      if(text.indexOf('google-visualization-errors')>-1||text.trim().length<20)continue;
      rows=parseCSV(text).slice(1);
      if(rows.length)break;
    }catch(err){console.log('Failed sheet',sheetName,':',err.message);}
  }
  if(!rows.length)return false;

  ALL_ROWS=rows.map(r=>{
    const rawUrl=(r[0]||'').trim();
    const rawDate=(r[1]||'').trim();
    const content=(r[2]||'').trim();
    const summary=(r[4]||'').trim();
    const theme=(r[6]||'').trim();
    let date=null;
    if(rawDate){
      date=new Date(rawDate);
      if(isNaN(date)){const m=rawDate.match(/(\d{1,2})\s+(\w{3})\s+(\d{4})/);if(m)date=new Date(m[1]+' '+m[2]+' '+m[3]);}
    }
    const um=content.match(/https?:\/\/\S+/);
    const articleUrl=um?um[0]:rawUrl;
    const body=content.replace(/https?:\/\/\S+/g,'').trim();
    const text=(body||summary||'').replace(/\s+/g,' ').trim();
    let domain='';try{domain=new URL(articleUrl||rawUrl).hostname.replace('www.','');}catch(_){}
    return{articleUrl:articleUrl||rawUrl,date,text,theme,domain};
  }).filter(r=>r.text&&r.date&&!isNaN(r.date)).sort((a,b)=>b.date-a.date);
  return ALL_ROWS.length>0;
}

/* Stable per-day pick, rolls at 3am */
function getCuratedDeck(){
  const d=new Date();
  const day=d.getHours()<3?d.getDate()-1:d.getDate();
  let s=d.getFullYear()*10000+(d.getMonth()+1)*100+day;
  const rng=()=>{s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/0xffffffff;};
  const pool=ALL_ROWS.slice(0,120),picked=[];
  while(picked.length<CURATED_COUNT&&pool.length)picked.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);
  return picked;
}

/* Full text, size scaled to length — never truncated */
function sizeFor(len){
  if(len>900)return['15px','1.65'];
  if(len>600)return['16px','1.6'];
  if(len>380)return['18px','1.6'];
  if(len>220)return['21px','1.4'];
  if(len>140)return['24px','1.4'];
  if(len>95) return['28px','1.24'];
  if(len>55) return['32px','1.24'];
  return['38px','1.2'];
}

function fillCard(row){
  if(!row)return;
  const app=document.querySelector('.app');
  app.style.setProperty('--accent',accentFor(row.theme));

  const th=document.getElementById('theme');
  if(row.theme){document.getElementById('theme-text').textContent=themeLabel(row.theme);th.style.display='';}
  else th.style.display='none';

  const sig=document.getElementById('signal');
  sig.textContent=row.text||'';
  const [size,lead]=sizeFor((row.text||'').length);
  sig.style.fontSize=size;sig.style.lineHeight=lead;
  sig.scrollTop=0;

  const src=document.getElementById('source');
  src.textContent=row.domain||'source';
  src.href=row.articleUrl||'#';
  document.getElementById('date').textContent=row.date?
    row.date.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
  document.getElementById('meta').style.display='';
  document.getElementById('loading-line').style.display='none';
}

function renderSegs(){
  const el=document.getElementById('segs');
  if(MODE!=='today'){el.innerHTML='';return;}
  el.innerHTML=DECK.map((_,i)=>{
    const c=i===IDX?'now':i<IDX?'past':'';
    return'<div class="seg '+c+'"></div>';
  }).join('');
}

function updateHUD(){
  const label=MODE==='today'?'Daily signal':
    MODE==='archive'?(ARCHIVE_REVERSED?'Archive · oldest first':'Archive'):
    (DEEPER_THEME?'Thread · '+themeLabel(DEEPER_THEME):'Thread');
  document.getElementById('mode-label').textContent=label;
  const pad=n=>String(n).padStart(2,'0');
  document.getElementById('count').textContent=DECK.length?pad(IDX+1)+' / '+pad(DECK.length):'';
  document.getElementById('btn-back').classList.toggle('off',IDX===0);
  document.getElementById('btn-next').textContent=
    IDX>=DECK.length-1?(MODE==='today'?'Start over':'Back to start'):'Next';
  document.getElementById('btn-deeper').textContent=MODE==='deeper'?'← today':'more like this';
  document.getElementById('btn-archive').textContent=MODE==='archive'?'← today':'archive';

  const jb=document.getElementById('jump');
  if(MODE==='deeper'&&JUMP_DATE){
    jb.textContent='↩ '+JUMP_DATE.toLocaleDateString('en-US',{month:'short',year:'numeric'});
    jb.style.display='';
    jb.onclick=()=>{const d=JUMP_DATE;JUMP_DATE=null;toArchive(d);};
  }else jb.style.display='none';

  renderSegs();
}

function swap(fn){
  if(BUSY)return;
  BUSY=true;
  const card=document.getElementById('card');
  card.classList.add('fade');
  setTimeout(()=>{
    fn();
    fillCard(DECK[IDX]);
    updateHUD();
    card.classList.remove('fade');
    BUSY=false;
  },150);
}

function go(dir){
  const next=IDX+dir;
  if(next<0)return;
  swap(()=>{IDX=next>=DECK.length?0:next;});
}

function goHome(){
  swap(()=>{MODE='today';DECK=getCuratedDeck();IDX=0;DEEPER_THEME='';JUMP_DATE=null;ARCHIVE_REVERSED=false;});
}

function toArchive(jumpToDate){
  if(MODE==='archive'&&!jumpToDate)return goHome();
  swap(()=>{
    MODE='archive';ARCHIVE_REVERSED=false;JUMP_DATE=null;
    DECK=[...ALL_ROWS];IDX=0;
    if(jumpToDate){
      const t=jumpToDate.getTime();let best=0,bd=Infinity;
      DECK.forEach((r,i)=>{const d=Math.abs(r.date.getTime()-t);if(d<bd){bd=d;best=i;}});
      IDX=best;
    }
  });
}

function toDeeper(){
  if(MODE==='deeper')return goHome();
  const cur=DECK[IDX];
  if(!cur)return;
  const key=(cur.theme||'').split(/[,\/|]/)[0].trim().toLowerCase();
  const rel=key?ALL_ROWS.filter(r=>r!==cur&&(r.theme||'').toLowerCase().indexOf(key)>-1):[];
  if(!rel.length){
    const b=document.getElementById('btn-deeper');
    const o=b.textContent;b.textContent='nothing related';
    setTimeout(()=>{b.textContent=o;},1500);
    return;
  }
  const from=MODE==='archive'?cur.date:null;
  swap(()=>{MODE='deeper';DEEPER_THEME=cur.theme||'';DECK=rel;IDX=0;JUMP_DATE=from;});
}

/* Swipe + keys */
document.addEventListener('touchstart',e=>{TX=e.touches[0].clientX;TY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-TX,dy=e.changedTouches[0].clientY-TY;
  if(Math.abs(dx)<44||Math.abs(dy)>Math.abs(dx)*0.8)return;
  go(dx<0?1:-1);
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(1);
  if(e.key==='ArrowLeft')go(-1);
});

async function init(){
  try{
    const ok=await loadData();
    if(!ok)throw new Error('No signals loaded — check sheet sharing');
    MODE='today';DECK=getCuratedDeck();IDX=0;
    fillCard(DECK[0]);
    updateHUD();
    document.getElementById('nav').classList.remove('disabled');
    document.getElementById('foot').classList.remove('disabled');
  }catch(err){
    document.getElementById('loading-line').textContent=err.message;
    document.getElementById('note').textContent='open the console for details';
  }
}
init();
</script>
</body>
</html>
