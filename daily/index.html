<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Daily Signal">
    <meta name="theme-color" content="#0d0c11">
    <title>Daily Signal</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
    <style>
    :root {
        --bg: #0d0c11;
        --txt: #f6f4ef;
        --txt2: #9d97ab;
        --txt3: #6f6a7d;
        --txt4: #4e4a5b;
        --line: #221f2a;
        --line2: #322d3f;
        --accent-default: oklch(0.74 0.09 300);
        --mono: 'DM Mono', ui-monospace, monospace;
        --serif: 'Newsreader', Georgia, serif;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        background: var(--bg);
        color: var(--txt);
        font-family: var(--serif);
        overflow: hidden;
    }

    a {
        color: var(--txt);
    }

    a:hover {
        color: #fff;
    }

    .app {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: calc(var(--safe-top) + 18px) 22px calc(var(--safe-bottom) + 18px);
    }/* ── Header ─────────────────────────────── */
    .hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-shrink: 0;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: .14em;
        text-transform: uppercase;
    }

    .toggle {
        display: flex;
        align-items: center;
        gap: 2px;
    }

    .toggle button {
        background: none;
        border: 0;
        cursor: pointer;
        padding: 5px 9px;
        border-radius: 2px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: var(--txt4);
        transition: color .15s, background .15s;
    }

    .toggle button.on {
        color: var(--txt);
        background: #17151f;
    }

    .toggle .div {
        color: #2b2834;
        font-size: 10px;
    }

    .hdr-count {
        letter-spacing: .1em;
        color: var(--txt3);
        white-space: nowrap;
    }/* ── Timeline spine ─────────────────────── */
    .spine {
        position: relative;
        height: 42px;
        margin-top: 14px;
        flex-shrink: 0;
        touch-action: none;
        cursor: pointer;
    }

    .spine-hint {
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: #332f3e;
        margin-top: -2px;
        flex-shrink: 0;
        height: 10px;
    }

    .spine-scrub {
        position: absolute;
        top: 19px;
        bottom: 8px;
        width: 1px;
        background: #5a5370;
    }

    .spine-scrub-lbl {
        position: absolute;
        top: 2px;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--txt);
        transform: translateX(-50%);
        white-space: nowrap;
    }

    .spine-line {
        position: absolute;
        left: 0;
        right: 0;
        top: 26px;
        height: 1px;
        background: #232030;
    }

    .spine-tick {
        position: absolute;
        top: 22px;
        width: 1px;
        height: 5px;
        background: #2b2837;
        transform: translateX(-.5px);
    }

    .spine-yr {
        position: absolute;
        top: 31px;
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: .08em;
        color: #413c4d;
        transform: translateX(-50%);
        white-space: nowrap;
    }

    .spine-yr.edge-l {
        transform: none;
    }

    .spine-yr.edge-r {
        transform: translateX(-100%);
    }

    .spine-dot {
        position: absolute;
        top: 26px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #3a3547;
        transform: translate(-50%, -50%);
        transition: all .2s;
    }

    .spine-dot.done {
        background: #4a4459;
    }

    .spine-now {
        position: absolute;
        top: 26px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent, var(--accent-default));
        transform: translate(-50%, -50%);
        box-shadow: 0 0 0 4px rgba(13, 12, 17, .95);
        transition: left .28s cubic-bezier(.4, 0, .2, 1);
        z-index: 2;
    }

    .spine-lbl {
        position: absolute;
        top: 2px;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--txt2);
        transform: translateX(-50%);
        white-space: nowrap;
        transition: left .28s cubic-bezier(.4, 0, .2, 1);
    }/* ── Card ───────────────────────────────── */
    .card {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
        padding: 26px 0;
        min-height: 0;
        transition: opacity .16s ease, transform .16s ease;
    }

    .card.fade {
        opacity: 0;
        transform: translateY(6px);
    }

    .theme {
        display: flex;
        align-items: center;
        gap: 9px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: #8a8499;
        flex-shrink: 0;
    }

    .theme-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent, var(--accent-default));
        flex-shrink: 0;
    }

    .ago {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--accent, var(--accent-default));
        flex-shrink: 0;
    }

    .signal {
        font-weight: 300;
        letter-spacing: -.01em;
        color: var(--txt);
        text-wrap: pretty;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        min-height: 0;
    }

    .signal.empty {
        color: var(--txt4);
        font-size: 22px;
        line-height: 1.4;
    }

    .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 16px;
        font-family: var(--mono);
        font-size: 11px;
        flex-shrink: 0;
    }

    .meta a {
        color: var(--txt);
        text-decoration: none;
        border-bottom: 1px solid #37333f;
        padding-bottom: 3px;
        letter-spacing: .02em;
    }

    .meta .date {
        color: var(--txt4);
        white-space: nowrap;
    }

    .jump {
        background: none;
        border: 0;
        padding: 3px 0;
        color: var(--txt3);
        font-family: var(--mono);
        font-size: 11px;
        cursor: pointer;
    }

    .loading-line {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: #5c5769;
    }/* ── Rating ─────────────────────────────── */
    .rate {
        flex-shrink: 0;
    }

    .rate-q {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: var(--txt4);
        margin-bottom: 9px;
    }

    .rate-row {
        display: flex;
        gap: 7px;
    }

    .rate-row button {
        flex: 1;
        min-height: 46px;
        padding: 6px 4px;
        cursor: pointer;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: transparent;
        color: var(--txt3);
        font-family: var(--mono);
        font-size: 9.5px;
        line-height: 1.3;
        letter-spacing: .06em;
        text-transform: uppercase;
        transition: border-color .15s, color .15s, background .15s;
    }

    .rate-row button:active {
        background: #161420;
    }

    .rate-row button.on {
        border-color: var(--accent, var(--accent-default));
        color: var(--txt);
        background: #17151f;
    }

    .rate-status {
        margin-top: 7px;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: #3d3849;
        min-height: 11px;
    }/* ── Nav ────────────────────────────────── */
    .nav {
        display: flex;
        gap: 10px;
        flex-shrink: 0;
        margin-top: 14px;
    }

    .nav button {
        min-height: 52px;
        border-radius: 2px;
        font-family: var(--mono);
        font-size: 12px;
        cursor: pointer;
        background: transparent;
        transition: background .12s, color .12s;
    }

    .btn-back {
        flex: 1;
        border: 1px solid var(--line);
        color: #8a8499;
        letter-spacing: .08em;
    }

    .btn-back:active {
        background: #161420;
    }

    .btn-back.off {
        color: #332f3c;
        pointer-events: none;
    }

    .btn-next {
        flex: 4;
        border: 1px solid var(--line2);
        background: #15131d;
        color: var(--txt);
        letter-spacing: .12em;
        text-transform: uppercase;
    }

    .btn-next:active {
        background: #1d1a27;
    }

    .foot {
        display: flex;
        justify-content: space-between;
        margin-top: 14px;
        flex-shrink: 0;
    }

    .foot button {
        background: none;
        border: 0;
        padding: 6px 0;
        color: #5c5769;
        white-space: nowrap;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: .12em;
        text-transform: uppercase;
        cursor: pointer;
    }

    .foot button:active {
        color: var(--txt2);
    }

    .disabled {
        opacity: .35;
        pointer-events: none;
    }

    .note {
        margin-top: 8px;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: #463f52;
        min-height: 11px;
    }
    </style>
</head>
<body>

    <div class="app">
        <div class="hdr">
            <div class="toggle">
                <button id="tab-today" class="on" onclick="goHome()">Today</button>
                <span class="div">/</span>
                <button id="tab-then" onclick="toThen()">Then</button>
            </div>
            <span class="hdr-count" id="count"></span>
        </div>

        <div class="spine" id="spine">
            <div class="spine-line"></div>
        </div>
        <div class="spine-hint" id="spine-hint"></div>

        <div class="card" id="card">
            <div class="ago" id="ago" style="display:none;"></div>
            <div class="theme" id="theme" style="display:none;">
                <span class="theme-dot"></span>
                <span id="theme-text"></span>
            </div>
            <div class="signal" id="signal"></div>
            <div class="loading-line" id="loading-line">Loading signals…</div>
            <div class="meta" id="meta" style="display:none;">
                <a id="source" href="#" target="_blank" rel="noopener"></a>
                <button class="jump" id="jump" style="display:none;"></button>
                <span class="date" id="date"></span>
            </div>
        </div>

        <div class="rate" id="rate" style="display:none;">
            <div class="rate-q" id="rate-q">Where has this gone?</div>
            <div class="rate-row">
                <button data-v="fizzled" onclick="rate('fizzled')">
                    Fizzled
                    <br>
                    out
                </button>
                <button data-v="continuing" onclick="rate('continuing')">
                    Continuing
                    <br>
                    same way
                </button>
                <button data-v="shifting" onclick="rate('shifting')">
                    Shifting
                    <br>
                    impacts
                </button>
            </div>
            <div class="rate-status" id="rate-status"></div>
        </div>

        <div class="nav disabled" id="nav">
            <button class="btn-back off" id="btn-back" onclick="go(-1)">←</button>
            <button class="btn-next" id="btn-next" onclick="go(1)">Next</button>
        </div>

        <div class="foot disabled" id="foot">
            <button id="btn-deeper" onclick="toDeeper()">more like this</button>
            <button id="btn-archive" onclick="toArchive()">archive</button>
        </div>

        <div class="note" id="note"></div>
    </div>

    <script>
    /* ═══════════════════════════════════════════════════════════
       CONFIG
       RATINGS_URL — paste your Apps Script Web App /exec URL here.
       Deploy: Extensions → Apps Script in the sheet, paste the
       doPost snippet, Deploy → Web app → Execute as: Me,
       Access: Anyone. See README notes.
       ═══════════════════════════════════════════════════════════ */
    const SHEET_ID = '1hMRxFT9kAaGQ7rGU9G8R5cpfrMM8I8nyrxLiJ1KFoBg';
    const RATINGS_URL = 'https://script.google.com/macros/s/AKfycbzuyDZvRsdlT6sD8gVkv6Uo8lhBE_9IltbK-dzvenw_1X6pBqMAfi7r0zm3YhFiC04Q/exec'; // ← your existing Apps Script /exec URL
    const RATINGS_TOKEN = 'pickles1129'; // ← SECRET_TOKEN from your Apps Script
    const CURATED_COUNT = 5;
    const THEN_YEARS_BACK = 8; // how many prior years "Then" walks

    const ACCENTS = {
        social: 'oklch(0.74 0.11 350)',
        society: 'oklch(0.74 0.11 350)',
        technolog: 'oklch(0.74 0.11 265)',
        econom: 'oklch(0.74 0.11 195)',
        environm: 'oklch(0.74 0.11 145)',
        politic: 'oklch(0.74 0.11 55)',
        legal: 'oklch(0.74 0.11 95)'
    };
    const DEFAULT_ACCENT = 'oklch(0.74 0.09 300)';
    const RATE_LABEL = {
        fizzled: 'fizzled out',
        continuing: 'continuing same way',
        shifting: 'shifting impacts'
    };

    let ALL_ROWS = [],
        DECK = [],
        IDX = 0,
        MODE = 'today',
        DEEPER_THEME = '',
        JUMP_DATE = null;
    let SPAN_MIN = 0,
        SPAN_MAX = 1,
        BUSY = false,
        TX = 0,
        TY = 0;
    let SCRUBBING = false,
        SCRUB_T = 0,
        DAY_LABEL = '';
    let RATINGS = {},
        QUEUE = [];

    /* ── storage ─────────────────────────────── */
    function loadStore() {
        try {
            RATINGS = JSON.parse(localStorage.getItem('signal-ratings') || '{}');
        } catch (e) {
            RATINGS = {};
        }
        try {
            QUEUE = JSON.parse(localStorage.getItem('signal-rating-queue') || '[]');
        } catch (e) {
            QUEUE = [];
        }
    }
    function saveStore() {
        try {
            localStorage.setItem('signal-ratings', JSON.stringify(RATINGS));
            localStorage.setItem('signal-rating-queue', JSON.stringify(QUEUE));
        } catch (e) {}
    }
    function keyFor(row) {
        if (!row)
            return '';
        return row.rowUrl || row.articleUrl || ((row.date ? row.date.toISOString().slice(0, 10) : '') + '|' + (row.text || '').slice(0, 60));
    }

    /* ── sheet write ─────────────────────────── */
    function post(entry) {
        if (!RATINGS_URL)
            return Promise.reject(new Error('no endpoint'));
        return fetch(RATINGS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify({
                action: 'rating',
                token: RATINGS_TOKEN,
                rowUrl: entry.key,
                articleUrl: entry.url || '',
                rating: entry.rating,
                label: entry.rating ? (RATE_LABEL[entry.rating] || entry.rating) : '',
                signalDate: entry.signalDate || '',
                theme: entry.theme || '',
                ratedAt: entry.ratedAt
            })
        });
    }
    async function flushQueue() {
        if (!RATINGS_URL || !QUEUE.length)
            return;
        const pending = QUEUE.slice();
        QUEUE = [];
        saveStore();
        for (const e of pending) {
            try {
                await post(e);
            } catch (err) {
                QUEUE.push(e);
            }
        }
        saveStore();
        if (QUEUE.length)
            setStatus(QUEUE.length + ' rating' + (QUEUE.length > 1 ? 's' : '') + ' queued');
    }
    function setStatus(t) {
        document.getElementById('rate-status').textContent = t || '';
    }

    function rate(v) {
        const row = DECK[IDX];
        if (!row)
            return;
        const k = keyFor(row);
        const cleared = RATINGS[k] === v;
        if (cleared)
            delete RATINGS[k];
        else
            RATINGS[k] = v;
        const entry = {
            key: k,
            url: row.articleUrl || '',
            rating: cleared ? '' : v,
            signalDate: row.date ? row.date.toISOString().slice(0, 10) : '',
            theme: row.theme || '',
            ratedAt: new Date().toISOString()
        };
        QUEUE.push(entry);
        saveStore();
        paintRating(row);
        if (!RATINGS_URL) {
            setStatus('saved on device · sheet not connected');
            return;
        }
        setStatus(cleared ? 'clearing…' : 'saving…');
        post(entry).then(() => {
            QUEUE = QUEUE.filter(q => !(q.key === entry.key && q.ratedAt === entry.ratedAt));
            saveStore();
            setStatus(cleared ? 'cleared in sheet' : 'saved to sheet');
        }).catch(() => {
            setStatus('offline · will retry');
        });
    }
    function paintRating(row) {
        const cur = RATINGS[keyFor(row)];
        document.querySelectorAll('.rate-row button').forEach(b => {
            b.classList.toggle('on', b.dataset.v === cur);
        });
        document.getElementById('rate-q').textContent = cur ? 'Your read' : 'Where has this gone?';
        setStatus('');
    }

    /* ── theme colour ────────────────────────── */
    function accentFor(theme) {
        const first = (theme || '').split(/[,\/|]/)[0].trim().toLowerCase();
        if (!first)
            return DEFAULT_ACCENT;
        for (const k in ACCENTS)
            if (first.indexOf(k) > -1)
                return ACCENTS[k];
        return DEFAULT_ACCENT;
    }
    function themeLabel(theme) {
        return (theme || '').split(/[,\/|]/).map(t => t.trim()).filter(Boolean).slice(0, 2).join(' · ');
    }

    /* ── CSV ─────────────────────────────────── */
    function parseCSV(text) {
        const rows = [];
        let i = 0;
        while (i < text.length) {
            const row = [];
            while (i < text.length && text[i] !== '\n') {
                if (text[i] === '"') {
                    let cell = '';
                    i++;
                    while (i < text.length) {
                        if (text[i] === '"' && text[i + 1] === '"') {
                            cell += '"';
                            i += 2;
                        }
                        else if (text[i] === '"') {
                            i++;
                            break;
                        }
                        else
                            cell += text[i++];
                    }
                    row.push(cell);
                    if (text[i] === ',')
                        i++;
                } else {
                    let cell = '';
                    while (i < text.length && text[i] !== ',' && text[i] !== '\n')
                        cell += text[i++];
                    row.push(cell);
                    if (text[i] === ',')
                        i++;
                }
            }
            if (text[i] === '\n')
                i++;
            if (row.some(c => c.trim()))
                rows.push(row);
        }
        return rows;
    }

    async function loadData() {
        const sheetNames = ['Archive', 'archive', 'Sheet1'];
        let rows = [];
        for (const sheetName of sheetNames) {
            try {
                const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(sheetName);
                const res = await Promise.race([fetch(url), new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout')), 12000))]);
                if (!res.ok)
                    continue;
                const text = await res.text();
                if (text.indexOf('google-visualization-errors') > -1 || text.trim().length < 20)
                    continue;
                rows = parseCSV(text).slice(1);
                if (rows.length)
                    break;
            } catch (err) {
                console.log('Failed sheet', sheetName, ':', err.message);
            }
        }
        if (!rows.length)
            return false;

        ALL_ROWS = rows.map(r => {
            const rawUrl = (r[0] || '').trim(),
                rawDate = (r[1] || '').trim();
            const content = (r[2] || '').trim(),
                summary = (r[4] || '').trim(),
                theme = (r[6] || '').trim();
            let date = null;
            if (rawDate) {
                date = new Date(rawDate);
                if (isNaN(date)) {
                    const m = rawDate.match(/(\d{1,2})\s+(\w{3})\s+(\d{4})/);
                    if (m)
                        date = new Date(m[1] + ' ' + m[2] + ' ' + m[3]);
                }
            }
            const um = content.match(/https?:\/\/\S+/);
            const articleUrl = um ? um[0] : rawUrl;
            const body = content.replace(/https?:\/\/\S+/g, '').trim();
            const text = (body || summary || '').replace(/\s+/g, ' ').trim();
            let domain = '';
            try {
                domain = new URL(articleUrl || rawUrl).hostname.replace('www.', '');
            } catch (_) {}
            return {
                rowUrl: rawUrl,
                articleUrl: articleUrl || rawUrl,
                date,
                text,
                theme,
                domain
            };
        }).filter(r => r.text && r.date && !isNaN(r.date)).sort((a, b) => b.date - a.date);

        if (ALL_ROWS.length) {
            SPAN_MAX = ALL_ROWS[0].date.getTime();
            SPAN_MIN = ALL_ROWS[ALL_ROWS.length - 1].date.getTime();
            if (SPAN_MAX <= SPAN_MIN)
                SPAN_MAX = SPAN_MIN + 864e5;
        }
        return ALL_ROWS.length > 0;
    }

    /* ── decks ───────────────────────────────── */
    function getCuratedDeck() {
        const d = new Date();
        const day = d.getHours() < 3 ? d.getDate() - 1 : d.getDate();
        let s = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + day;
        const rng = () => {
            s = (s * 1664525 + 1013904223) & 0xffffffff;
            return (s >>> 0) / 0xffffffff;
        };
        const pool = [...ALL_ROWS],
            picked = [];
        while (picked.length < CURATED_COUNT && pool.length)
            picked.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]);
        return picked;
    }

    /* One card per prior year: the signal logged on this exact date. */
    function getThenDeck() {
        const now = new Date(),
            m = now.getMonth(),
            d = now.getDate(),
            y = now.getFullYear();
        const out = [];
        for (let back = 1; back <= THEN_YEARS_BACK; back++) {
            const yr = y - back;
            if (yr < new Date(SPAN_MIN).getFullYear() - 0)
                break;
            const hits = ALL_ROWS.filter(r => r.date.getFullYear() === yr && r.date.getMonth() === m && r.date.getDate() === d);
            if (hits.length)
                out.push(Object.assign({}, hits[0], {
                    yearsAgo: back,
                    siblings: hits.length
                }));
            else
                out.push({
                    empty: true,
                    yearsAgo: back,
                    date: new Date(yr, m, d),
                    text: '',
                    theme: '',
                    domain: '',
                    articleUrl: ''
                });
        }
        return out;
    }

    /* ── timeline spine ──────────────────────── */
    function pct(t) {
        return Math.max(0, Math.min(1, (t - SPAN_MIN) / (SPAN_MAX - SPAN_MIN))) * 100;
    }

    function renderSpine() {
        const el = document.getElementById('spine');
        if (!ALL_ROWS.length) {
            el.innerHTML = '<div class="spine-line"></div>';
            return;
        }
        const cur = DECK[IDX];
        let h = '<div class="spine-line"></div>';

        const y0 = new Date(SPAN_MIN).getFullYear(),
            y1 = new Date(SPAN_MAX).getFullYear();
        const span = y1 - y0 || 1;
        const step = span > 9 ? Math.ceil(span / 5) : span > 5 ? 2 : 1;
        for (let y = y0; y <= y1; y++) {
            const p = pct(new Date(y, 0, 1).getTime());
            if (p <= 0 || p >= 100)
                continue;
            h += '<div class="spine-tick" style="left:' + p + '%"></div>';
            if ((y - y0) % step === 0)
                h += '<div class="spine-yr" style="left:' + p + '%">\u2019' + String(y).slice(2) + '</div>';
        }
        h += '<div class="spine-yr edge-l" style="left:0">' + y0 + '</div>';
        h += '<div class="spine-yr edge-r" style="left:100%">now</div>';

        if (DECK.length <= 14) {
            DECK.forEach((r, i) => {
                if (i === IDX || !r.date)
                    return;
                h += '<div class="spine-dot' + (i < IDX ? ' done' : '') + '" style="left:' + pct(r.date.getTime()) + '%"></div>';
            });
        }
        if (cur && cur.date) {
            const p = pct(cur.date.getTime());
            const lbl = cur.date.toLocaleDateString('en-US', {
                month: 'short',
                year: 'numeric'
            });
            const clamp = Math.max(9, Math.min(91, p));
            h += '<div class="spine-now" style="left:' + p + '%"></div>';
            h += '<div class="spine-lbl" style="left:' + clamp + '%">' + lbl + '</div>';
        }
        el.innerHTML = h;
    }

    /* ── card ────────────────────────────────── */
    function sizeFor(len) {
        if (len > 900)
            return ['15px', '1.65'];
        if (len > 600)
            return ['16px', '1.6'];
        if (len > 380)
            return ['18px', '1.6'];
        if (len > 220)
            return ['21px', '1.4'];
        if (len > 140)
            return ['24px', '1.4'];
        if (len > 95)
            return ['28px', '1.24'];
        if (len > 55)
            return ['32px', '1.24'];
        return ['38px', '1.2'];
    }

    function fillCard(row) {
        if (!row)
            return;
        const app = document.querySelector('.app');
        app.style.setProperty('--accent', row.empty ? '#4a4459' : accentFor(row.theme));

        const agoEl = document.getElementById('ago');
        if (row.yearsAgo) {
            agoEl.textContent = row.yearsAgo === 1 ? 'One year ago today' : row.yearsAgo + ' years ago today';
            agoEl.style.display = '';
        } else
            agoEl.style.display = 'none';

        const th = document.getElementById('theme');
        if (row.theme && !row.empty) {
            document.getElementById('theme-text').textContent = themeLabel(row.theme);
            th.style.display = '';
        }
        else
            th.style.display = 'none';

        const sig = document.getElementById('signal');
        if (row.empty) {
            sig.textContent = 'Nothing logged on ' + row.date.toLocaleDateString('en-US', {
                month: 'long',
                day: 'numeric',
                year: 'numeric'
            }) + '.';
            sig.classList.add('empty');
            sig.style.fontSize = '';
            sig.style.lineHeight = '';
        } else {
            sig.classList.remove('empty');
            sig.textContent = row.text || '';
            const [size, lead] = sizeFor((row.text || '').length);
            sig.style.fontSize = size;
            sig.style.lineHeight = lead;
        }
        sig.scrollTop = 0;

        const meta = document.getElementById('meta');
        if (row.empty) {
            meta.style.display = 'none';
        }
        else {
            const src = document.getElementById('source');
            src.textContent = row.domain || 'source';
            src.href = row.articleUrl || '#';
            document.getElementById('date').textContent = row.date ?
            row.date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            }) : '';
            meta.style.display = '';
        }
        document.getElementById('loading-line').style.display = 'none';

        const rateBox = document.getElementById('rate');
        if (row.empty) {
            rateBox.style.display = 'none';
        }
        else {
            rateBox.style.display = '';
            paintRating(row);
        }
    }

    function updateHUD() {
        document.getElementById('tab-today').classList.toggle('on', MODE === 'today');
        document.getElementById('tab-then').classList.toggle('on', MODE === 'then');

        const pad = n => String(n).padStart(2, '0');
        const cnt = document.getElementById('count');
        if (!DECK.length)
            cnt.textContent = '';
        else if (MODE === 'archive')
            cnt.textContent = 'Archive ' + pad(IDX + 1) + ' / ' + DECK.length;
        else if (MODE === 'deeper')
            cnt.textContent = (themeLabel(DEEPER_THEME) || 'Thread') + ' ' + pad(IDX + 1) + '/' + pad(DECK.length);
        else if (MODE === 'day')
            cnt.textContent = DAY_LABEL + ' · ' + pad(IDX + 1) + '/' + pad(DECK.length);
        else
            cnt.textContent = pad(IDX + 1) + ' / ' + pad(DECK.length);

        document.getElementById('btn-back').classList.toggle('off', IDX === 0);
        document.getElementById('btn-next').textContent =
        IDX >= DECK.length - 1 ? (MODE === 'today' ? 'Start over' : 'Back to first') : 'Next';
        document.getElementById('btn-deeper').textContent = MODE === 'deeper' ? '← today' : 'more like this';
        document.getElementById('btn-archive').textContent = MODE === 'archive' ? '← today' : 'archive';

        const jb = document.getElementById('jump');
        if (MODE === 'deeper' && JUMP_DATE) {
            jb.textContent = '↩ ' + JUMP_DATE.toLocaleDateString('en-US', {
                month: 'short',
                year: 'numeric'
            });
            jb.style.display = '';
            jb.onclick = () => {
                const d = JUMP_DATE;
                JUMP_DATE = null;
                toArchive(d);
            };
        } else
            jb.style.display = 'none';

        renderSpine();
        const hint = document.getElementById('spine-hint');
        if (hint)
            hint.textContent = ALL_ROWS.length ? (MODE === 'day' ? '' : 'press the timeline for any day') : '';
    }

    function swap(fn) {
        if (BUSY)
            return;
        BUSY = true;
        const card = document.getElementById('card');
        card.classList.add('fade');
        setTimeout(() => {
            fn();
            fillCard(DECK[IDX]);
            updateHUD();
            card.classList.remove('fade');
            BUSY = false;
        }, 150);
    }

    function go(dir) {
        const next = IDX + dir;
        if (next < 0)
            return;
        swap(() => {
            IDX = next >= DECK.length ? 0 : next;
        });
    }

    function goHome() {
        if (MODE === 'today')
            return;
        swap(() => {
            MODE = 'today';
            DECK = getCuratedDeck();
            IDX = 0;
            DEEPER_THEME = '';
            JUMP_DATE = null;
        });
    }

    function toThen() {
        if (MODE === 'then')
            return goHome();
        const deck = getThenDeck();
        if (!deck.length) {
            const b = document.getElementById('tab-then');
            const o = b.textContent;
            b.textContent = 'no archive yet';
            setTimeout(() => {
                b.textContent = o;
            }, 1500);
            return;
        }
        swap(() => {
            MODE = 'then';
            DECK = deck;
            IDX = 0;
            DEEPER_THEME = '';
            JUMP_DATE = null;
        });
    }

    function toArchive(jumpToDate) {
        if (MODE === 'archive' && !jumpToDate)
            return goHome();
        swap(() => {
            MODE = 'archive';
            JUMP_DATE = null;
            DECK = [...ALL_ROWS];
            IDX = 0;
            if (jumpToDate) {
                const t = jumpToDate.getTime();
                let best = 0,
                    bd = Infinity;
                DECK.forEach((r, i) => {
                    const d = Math.abs(r.date.getTime() - t);
                    if (d < bd) {
                        bd = d;
                        best = i;
                    }
                });
                IDX = best;
            }
        });
    }

    function toDeeper() {
        if (MODE === 'deeper')
            return goHome();
        const cur = DECK[IDX];
        if (!cur || cur.empty)
            return;
        const key = (cur.theme || '').split(/[,\/|]/)[0].trim().toLowerCase();
        const rel = key ? ALL_ROWS.filter(r => r !== cur && (r.theme || '').toLowerCase().indexOf(key) > -1) : [];
        if (!rel.length) {
            const b = document.getElementById('btn-deeper');
            const o = b.textContent;
            b.textContent = 'nothing related';
            setTimeout(() => {
                b.textContent = o;
            }, 1500);
            return;
        }
        const from = (MODE === 'archive' || MODE === 'then') ? cur.date : null;
        swap(() => {
            MODE = 'deeper';
            DEEPER_THEME = cur.theme || '';
            DECK = rel;
            IDX = 0;
            JUMP_DATE = from;
        });
    }

    /* ── spine scrubbing: tap or drag to open that day ── */
    function timeAt(e) {
        const el = document.getElementById('spine');
        const r = el.getBoundingClientRect();
        const f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
        return SPAN_MIN + f * (SPAN_MAX - SPAN_MIN);
    }
    function nearestDay(t) {
        if (!ALL_ROWS.length)
            return null;
        let best = ALL_ROWS[0],
            bd = Infinity;
        ALL_ROWS.forEach(r => {
            const d = Math.abs(r.date.getTime() - t);
            if (d < bd) {
                bd = d;
                best = r;
            }
        });
        return best.date;
    }
    function drawScrub() {
        const el = document.getElementById('spine');
        el.querySelectorAll('.spine-scrub,.spine-scrub-lbl').forEach(n => n.remove());
        if (!SCRUBBING)
            return;
        const p = pct(SCRUB_T),
            day = nearestDay(SCRUB_T);
        const a = document.createElement('div');
        a.className = 'spine-scrub';
        a.style.left = p + '%';
        el.appendChild(a);
        if (day) {
            const b = document.createElement('div');
            b.className = 'spine-scrub-lbl';
            b.style.left = Math.max(9, Math.min(91, p)) + '%';
            b.textContent = day.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
            el.appendChild(b);
        }
    }
    function openDay(date) {
        const y = date.getFullYear(),
            m = date.getMonth(),
            d = date.getDate();
        const hits = ALL_ROWS.filter(r => r.date.getFullYear() === y && r.date.getMonth() === m && r.date.getDate() === d);
        if (!hits.length)
            return;
        DAY_LABEL = date.toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric'
        });
        swap(() => {
            MODE = 'day';
            DECK = hits;
            IDX = 0;
            DEEPER_THEME = '';
            JUMP_DATE = null;
        });
    }
    (function() {
        const el = document.getElementById('spine');
        el.addEventListener('pointerdown', e => {
            if (!ALL_ROWS.length)
                return;
            SCRUBBING = true;
            SCRUB_T = timeAt(e);
            try {
                el.setPointerCapture(e.pointerId);
            } catch (_) {}
            drawScrub();
        });
        el.addEventListener('pointermove', e => {
            if (!SCRUBBING)
                return;
            SCRUB_T = timeAt(e);
            drawScrub();
        });
        const end = () => {
            if (!SCRUBBING)
                return;
            SCRUBBING = false;
            drawScrub();
            const day = nearestDay(SCRUB_T);
            if (day)
                openDay(day);
        };
        el.addEventListener('pointerup', end);
        el.addEventListener('pointercancel', end);
    })();

    /* ── input ───────────────────────────────── */
    document.addEventListener('touchstart', e => {
        TX = e.touches[0].clientX;
        TY = e.touches[0].clientY;
    }, {
        passive: true
    });
    document.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - TX,
            dy = e.changedTouches[0].clientY - TY;
        if (Math.abs(dx) < 44 || Math.abs(dy) > Math.abs(dx) * 0.8)
            return;
        go(dx < 0 ? 1 : -1);
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight')
            go(1);
        if (e.key === 'ArrowLeft')
            go(-1);
        if (e.key === 't')
            toThen();
    });
    window.addEventListener('online', flushQueue);

    async function init() {
        loadStore();
        try {
            const ok = await loadData();
            if (!ok)
                throw new Error('No signals loaded — check sheet sharing');
            MODE = 'today';
            DECK = getCuratedDeck();
            IDX = 0;
            fillCard(DECK[0]);
            updateHUD();
            document.getElementById('nav').classList.remove('disabled');
            document.getElementById('foot').classList.remove('disabled');
            flushQueue();
        } catch (err) {
            document.getElementById('loading-line').textContent = err.message;
            document.getElementById('note').textContent = 'open the console for details';
        }
    }
    init();
    </script>
</body>
</html>
